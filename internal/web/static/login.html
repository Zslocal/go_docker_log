<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>dlog · 需要口令</title>
<style>
:root{
  --bg:#0a0e13; --panel:#101720; --panel2:#16202b;
  --line:#1f2c38; --fg:#ccd8e4; --dim:#6f8194;
  --accent:#4c9aff; --err:#f0645c;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--bg);color:var(--fg);
  font:13px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  display:flex;align-items:center;justify-content:center;
  -webkit-font-smoothing:antialiased;
}
.card{
  width:min(340px,88vw);background:var(--panel);border:1px solid var(--line);
  border-radius:12px;padding:26px 24px 22px;
}
.logo{font-size:17px;font-weight:650;letter-spacing:.4px;margin-bottom:14px}
.logo i{color:var(--accent);font-style:normal}
.hint{margin:0 0 16px;font-size:12px;color:var(--dim);line-height:1.7}
input{
  width:100%;background:var(--bg);border:1px solid var(--line);border-radius:7px;
  padding:9px 11px;color:var(--fg);font-size:13px;outline:none;font-family:var(--mono);
}
input:focus{border-color:var(--accent)}
input::placeholder{color:#4d5f70;font-family:inherit}
button{
  width:100%;margin-top:11px;background:var(--accent);color:#04101f;border:none;
  border-radius:7px;padding:9px;font-size:13px;font-weight:650;cursor:pointer;
  font-family:inherit;
}
button:hover:not(:disabled){background:#5ea8ff}
button:disabled{opacity:.5;cursor:default}
.err{margin:11px 0 0;min-height:17px;font-size:12px;color:var(--err)}
</style>
</head>
<body>
<form class="card" id="f" autocomplete="on">
  <div class="logo">d<i>log</i></div>
  <p class="hint">该实例启用了访问口令，验证通过后会在浏览器留存 7 天。</p>
  <input id="tok" type="password" name="token" placeholder="访问口令" autocomplete="current-password" autofocus>
  <button type="submit" id="btn">进入</button>
  <p class="err" id="err"></p>
</form>
<script>
(function () {
  var f = document.getElementById('f');
  var tok = document.getElementById('tok');
  var btn = document.getElementById('btn');
  var err = document.getElementById('err');

  f.addEventListener('submit', async function (e) {
    e.preventDefault();
    var value = tok.value.trim();
    if (!value) { err.textContent = '请输入口令'; return; }

    btn.disabled = true;
    err.textContent = '';
    try {
      var res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token: value })
      });
      if (res.ok) { location.replace('/'); return; }
      var data = {};
      try { data = await res.json(); } catch (_) {}
      err.textContent = data.error || '口令不正确';
    } catch (_) {
      err.textContent = '无法连接服务，请稍后重试';
    }
    btn.disabled = false;
    tok.select();
  });
})();
</script>
</body>
</html>
