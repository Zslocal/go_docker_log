# dlog 容器化部署示例。
#
# 关键点：宿主机目录必须按它"原本的路径"挂进来，也就是
#   /app/docker/data  →  /host/app/docker/data
# 而不是随便挂到 /logs 之类的位置。因为 dlog 探测到的是 daemon.json 里写的
# 宿主机路径，只有保持路径一致，-host-root /host 才能把它映射对。
#
# 换机器时改这三处：data-root 路径、端口、daemon.json 位置。

services:
  dlog:
    build:
      context: .
      args:
        VERSION: v0.1.0
    image: dlog:v0.1.0
    container_name: dlog
    restart: unless-stopped

    ports:
      - "8080:8080"

    volumes:
      # 1) Docker 数据目录（只读）。日志就在 <data-root>/containers/<id>/ 下。
      #    冒号右边必须和左边保持一致，这是路径映射的前提。
      - /app/docker/data:/host/app/docker/data:ro

      # 2) daemon.json，用来读出 data-root 和默认日志驱动。
      #    如果宿主机的 /etc/docker/daemon.json 不存在，这行会让 docker 建一个
      #    同名目录，导致解析失败——那种情况下删掉本行，改用下面的 -data-root 即可。
      - /etc/docker/daemon.json:/host/etc/docker/daemon.json:ro

      # 3) 日志兜底通道：只有日志驱动不是 json-file/local 的容器才用得上。
      #    完全不需要的话可以删掉，并给启动参数加上 -no-api。
      - /var/run/docker.sock:/var/run/docker.sock:ro

    command:
      - "-listen"
      - ":8080"
      - "-host-root"
      - "/host"
      # 访问口令：在 .env 里写 DLOG_TOKEN=xxx（参考 .env.example）。
      # 这里用 :? 是故意的——没设置就直接启动失败，
      # 免得忘了加口令把日志页面裸奔到公网上。
      - "-web-token"
      - "${DLOG_TOKEN:?请先在 .env 里设置 DLOG_TOKEN}"
      # 探测不到时可以直接写死：
      # - "-data-root"
      # - "/app/docker/data"

    # 只读根文件系统足够跑（程序不写任何文件），进一步降低被利用的面
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
