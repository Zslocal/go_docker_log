# dlog 容器化部署示例。
#
# 关键点：宿主机目录必须按它"原本的路径"挂进来，也就是
#   /app/docker/data  →  /host/app/docker/data
# 而不是随便挂到 /logs 之类的位置。因为 dlog 探测到的是宿主机的 data-root，
# 只有保持路径一致，-host-root /host 才能把它映射对。
#
# data-root 的来源按优先级是：-data-root 参数 → docker socket 的 /info →
# daemon.json → 默认路径。挂了 socket 就不需要再挂 daemon.json。
#
# 换机器时改这几处：data-root 路径、端口。

services:
  dlog:
    build:
      context: .
      args:
        VERSION: v0.1.0
    image: dlog:v0.1.0
    container_name: dlog
    restart: unless-stopped

    ports:
      - "8080:8080"

    volumes:
      # 1) Docker 数据目录（只读）。日志就在 <data-root>/containers/<id>/ 下。
      #
      #    这里不再写死路径，只用一个变量 DLOG_DATA_ROOT 表达宿主机上的
      #    data-root，冒号右边由它自动拼成 /host + 同一路径。只改一处，
      #    两边就不可能不一致——这是最常见的踩坑点（挂到 /logs 之类的位置）。
      #
      #    不知道填什么？先用默认值启动。dlog 会通过 socket 问守护进程要
      #    真实路径，如果这里对不上，页面顶部会直接告诉你该改成哪一行。
      - ${DLOG_DATA_ROOT:-/var/lib/docker}:/host${DLOG_DATA_ROOT:-/var/lib/docker}:ro

      # 2) docker socket。dlog 用 GET /info 问守护进程要 data-root——这是
      #    最权威的来源（能反映 --data-root 命令行参数、systemd 覆盖等，
      #    这些都不会写进 daemon.json），同时负责非 json-file 驱动的日志
      #    兜底和 CPU/内存采集。
      - /var/run/docker.sock:/var/run/docker.sock:ro

      # 3) daemon.json 不需要挂。socket 的 /info 已经包含 DockerRootDir 和
      #    LoggingDriver，比读配置文件更准（配置文件里写的可能没生效）。
      #    只有禁用 socket（-no-api）的纯文件模式才需要它，那时再手动加：
      #      - /etc/docker/daemon.json:/host/etc/docker/daemon.json:ro

    command:
      - "-listen"
      - ":8080"
      - "-host-root"
      - "/host"
      # 访问口令：在 .env 里写 DLOG_TOKEN=xxx（参考 .env.example）。
      # 这里用 :? 是故意的——没设置就直接启动失败，
      # 免得忘了加口令把日志页面裸奔到公网上。
      - "-web-token"
      - "${DLOG_TOKEN:?请先在 .env 里设置 DLOG_TOKEN}"
      # socket 和 daemon.json 都读不到时，最省事的办法是直接写死：
      # - "-data-root"
      # - "/app/docker/data"

    # 只读根文件系统足够跑（程序不写任何文件），进一步降低被利用的面
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
